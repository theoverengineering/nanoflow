include: package:lints/recommended.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    equal_keys_in_map: error

linter:
  rules:
    - always_declare_return_types
    - directives_ordering
    - prefer_final_locals
    - prefer_single_quotes
    - unawaited_futures
