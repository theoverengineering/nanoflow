name: nanoflow
description: Runs nanoflow workflows, ordinary Dart functions, in the process of the app, with a journal per call that finds finished steps again.
publish_to: none
resolution: workspace
environment:
  sdk: ^3.13.0
dependencies:
  crypto: ^3.0.7
  nanoflow_model:
    path: ../nanoflow_model
  nanoflow_process:
    path: ../nanoflow_process
  nanoflow_store:
    path: ../nanoflow_store
  path: ^1.9.0
dev_dependencies:
  test: ^1.25.0
