<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nanoflow B — graphs</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0;font-family:'Geist',system-ui,sans-serif;background:#141517;-webkit-font-smoothing:antialiased}
a{color:#B7ABFF}a:hover{color:#D4CCFF}
button{font-family:inherit}
</style>
<style>html,body{margin:0;background:#141517}</style>
</head>
<body>

<div style="width: 1120px; height: 760px; box-sizing: border-box; display: flex; background: #1F2023; overflow: hidden;">


  <main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 40px 56px;">

    <div style="display: flex; align-items: flex-end; gap: 16px;">
      <div style="flex-grow: 1;">
        <h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: -0.015em; color: #ECECEE;">Graphs</h1>
        <p style="margin: 6px 0 0 0; font-size: 13.5px; color: #A7A8AE;">Open a graph file to watch its runs live.</p>
      </div>
      <button style="display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border: none; border-radius: 8px; background: #6D5DE8; color: #FFFFFF; font-size: 13.5px; font-weight: 600; cursor: pointer;">
        <svg width="14" height="14" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="M1.6 12.6V3.4a.9.9 0 0 1 .9-.9h3.2l1.5 1.8h6.3a.9.9 0 0 1 .9.9v7.4a.9.9 0 0 1-.9.9H2.5a.9.9 0 0 1-.9-.9Z" stroke="#FFFFFF" stroke-width="1.4" stroke-linejoin="round"/></svg>
        Open graph
      </button>
    </div>

    <div style="margin-top: 34px; display: flex; align-items: center; gap: 10px;">
      <span style="font-size: 12.5px; font-weight: 600; color: #D5D6DA;">Recently opened</span>
      <span style="font-family: 'Geist Mono', monospace; font-size: 11.5px; color: #8E8F96;">4</span>
    </div>

    <div style="margin-top: 12px; display: flex; flex-direction: column; gap: 8px;">

      <a href="graph.html" style="display: flex; align-items: center; gap: 14px; box-sizing: border-box; padding: 14px 16px; border-radius: 10px; background: #2B2745; border: 1px solid #4B4380; text-decoration: none;">
        <span style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 9px; background: #323338; border: 1px solid #45464C;">
          <svg width="20" height="20" viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="1.8" y="6.6" width="4.8" height="4.8" rx="1.2" stroke="#D5D6DA" stroke-width="1.2"/><rect x="11.4" y="2.2" width="4.8" height="4.8" rx="1.2" stroke="#D5D6DA" stroke-width="1.2"/><rect x="11.4" y="11" width="4.8" height="4.8" rx="1.2" stroke="#D5D6DA" stroke-width="1.2"/><path d="M6.6 9h1.8c.9 0 1.3-.5 1.3-1.3V5.9c0-.8.4-1.3 1.3-1.3h.4M8.4 9c.9 0 1.3.5 1.3 1.3v1.8c0 .8.4 1.3 1.3 1.3h.4" stroke="#D5D6DA" stroke-width="1.2" stroke-linecap="round"/></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
          <span style="font-size: 14px; font-weight: 600; color: #ECECEE;">review.yaml</span>
          <span style="font-family: 'Geist Mono', monospace; font-size: 11.5px; color: #A7A8AE;">~/Projects/review/review.yaml</span>
        </span>
        <span style="font-size: 12px; color: #A7A8AE; white-space: nowrap;">Opened 2 hours ago</span>
      </a>

      <button style="display: flex; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 10px; background: #26272B; border: 1px solid #303136; text-align: left; cursor: pointer;">
        <span style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 9px; background: #323338; border: 1px solid #45464C;">
          <svg width="20" height="20" viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="1.8" y="6.6" width="4.8" height="4.8" rx="1.2" stroke="#D5D6DA" stroke-width="1.2"/><rect x="11.4" y="2.2" width="4.8" height="4.8" rx="1.2" stroke="#D5D6DA" stroke-width="1.2"/><rect x="11.4" y="11" width="4.8" height="4.8" rx="1.2" stroke="#D5D6DA" stroke-width="1.2"/><path d="M6.6 9h1.8c.9 0 1.3-.5 1.3-1.3V5.9c0-.8.4-1.3 1.3-1.3h.4M8.4 9c.9 0 1.3.5 1.3 1.3v1.8c0 .8.4 1.3 1.3 1.3h.4" stroke="#D5D6DA" stroke-width="1.2" stroke-linecap="round"/></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
          <span style="font-size: 14px; font-weight: 600; color: #ECECEE;">release.yaml</span>
          <span style="font-family: 'Geist Mono', monospace; font-size: 11.5px; color: #A7A8AE;">~/work/deploy/release.yaml</span>
        </span>
        <span style="font-size: 12px; color: #A7A8AE; white-space: nowrap;">Opened yesterday</span>
      </button>

      <div style="display: flex; align-items: center; gap: 14px; box-sizing: border-box; padding: 14px 16px; border-radius: 10px; background: transparent; border: 1px dashed #3A3B41;">
        <span style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 9px; border: 1px dashed #45464C;">
          <svg width="20" height="20" viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="1.8" y="6.6" width="4.8" height="4.8" rx="1.2" stroke="#6E6F76" stroke-width="1.2"/><rect x="11.4" y="2.2" width="4.8" height="4.8" rx="1.2" stroke="#6E6F76" stroke-width="1.2"/><rect x="11.4" y="11" width="4.8" height="4.8" rx="1.2" stroke="#6E6F76" stroke-width="1.2"/></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
          <span style="display: flex; align-items: center; gap: 8px;">
            <span style="font-size: 14px; font-weight: 600; color: #8E8F96; text-decoration: line-through;">onboarding.yaml</span>
            <span style="padding: 1px 7px; border-radius: 999px; background: #3A1D20; font-size: 10.5px; font-weight: 600; color: #F7878C;">Missing</span>
          </span>
          <span style="font-family: 'Geist Mono', monospace; font-size: 11.5px; color: #8E8F96;">~/Projects/hr/onboarding.yaml</span>
        </span>
        <button style="padding: 5px 11px; border: 1px solid #3A3B41; border-radius: 7px; background: #2A2B30; color: #D5D6DA; font-size: 12px; cursor: pointer;">Remove</button>
      </div>

      <button style="display: flex; align-items: center; gap: 14px; width: 100%; box-sizing: border-box; padding: 14px 16px; border-radius: 10px; background: #26272B; border: 1px solid #303136; text-align: left; cursor: pointer;">
        <span style="width: 40px; height: 40px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 9px; background: #323338; border: 1px solid #45464C;">
          <svg width="20" height="20" viewBox="0 0 18 18" fill="none" aria-hidden="true"><rect x="1.8" y="6.6" width="4.8" height="4.8" rx="1.2" stroke="#D5D6DA" stroke-width="1.2"/><rect x="11.4" y="2.2" width="4.8" height="4.8" rx="1.2" stroke="#D5D6DA" stroke-width="1.2"/><rect x="11.4" y="11" width="4.8" height="4.8" rx="1.2" stroke="#D5D6DA" stroke-width="1.2"/><path d="M6.6 9h1.8c.9 0 1.3-.5 1.3-1.3V5.9c0-.8.4-1.3 1.3-1.3h.4M8.4 9c.9 0 1.3.5 1.3 1.3v1.8c0 .8.4 1.3 1.3 1.3h.4" stroke="#D5D6DA" stroke-width="1.2" stroke-linecap="round"/></svg>
        </span>
        <span style="display: flex; flex-direction: column; gap: 3px; flex-grow: 1; min-width: 0;">
          <span style="font-size: 14px; font-weight: 600; color: #ECECEE;">index.yaml</span>
          <span style="font-family: 'Geist Mono', monospace; font-size: 11.5px; color: #A7A8AE;">~/sandbox/index.yaml</span>
        </span>
        <span style="font-size: 12px; color: #A7A8AE; white-space: nowrap;">Opened Sep 8</span>
      </button>

    </div>
  </main>
</div>
</body>
</html>
